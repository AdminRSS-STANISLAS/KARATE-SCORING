name: Build & Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore FkcScoring.sln

      - name: Build
        run: dotnet build FkcScoring.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FkcScoring.sln --no-build --configuration Release
