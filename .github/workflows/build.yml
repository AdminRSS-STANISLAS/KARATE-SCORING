name: Build & Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # KarateScoring.Desktop (WPF, net9.0-windows) can't build on Linux — this filter is the full
      # solution minus that project. It still builds on every real Windows machine via
      # scripts/publish.ps1 / FkcScoring.sln directly; CI only needs the cross-platform pieces.
      - name: Restore
        run: dotnet restore FkcScoring.CI.slnf

      - name: Build
        run: dotnet build FkcScoring.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test FkcScoring.CI.slnf --no-build --configuration Release
